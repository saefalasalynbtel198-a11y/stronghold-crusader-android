plugins {
    id 'com.android.application'
}

// Version is defined once here; CI and release workflows read it via `gradle -q printVersion`.
def appVersionName = '0.5.1'
def appVersionCode = 20

android {
    // Windows test programs built by CI with mingw-w64 (app/winsrc, see .github/workflows/android-build.yml);
    // a local build without them still works, the display test then reports the program as missing.
    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/shc-assets"]
        }
    }
    namespace 'io.github.saefalasalynbtel198.shcport'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.saefalasalynbtel198.shcport'
        // Android 8.0: lowest version Box64/Wine-on-Android stacks are known to run on.
        minSdk 26
        // targetSdk 28 is required to run the Wine/Box64 runtime installed in app storage: for apps
        // targeting API 29+ Android blocks execve() AND PROT_EXEC mappings (dlopen) of files in the app
        // home directory (SELinux neverallow app_data_file:file execute). Termux and other Linux-userland
        // apps use 28 for the same reason. Consequence: sideload distribution only (not Google Play).
        // See docs/ARCHITECTURE.md "Executing the runtime on Android".
        targetSdk 28
        // CI's update test builds a second APK with a higher version code (-PshcVersionCodeBump=1); never delivered.
        versionCode appVersionCode + (project.findProperty('shcVersionCodeBump') ?: '0').toString().toInteger()
        versionName appVersionName
        // No native code in BUILD 1. When the runtime lands, it is arm64-v8a only (see ARCHITECTURE.md).
    }

    signingConfigs {
        release {
            // Populated only in the release workflow from GitHub Actions secrets.
            def ks = System.getenv('SHC_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SHC_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SHC_KEY_ALIAS')
                keyPassword System.getenv('SHC_KEY_PASSWORD')
            }
        }
        // The SHC Port signing key (since 0.3.6-dev.3): derived in CI from the GitHub Actions secret SHC_SIGNING_SEED,
        // checked against the committed certificate signing/shc-signing-cert.pem, written to a temporary keystore by
        // scripts/ci/signing.sh (docs/SIGNING.md). Never in the repository.
        shc {
            def ks = System.getenv('SHC_SIGNING_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('SHC_SIGNING_KEYSTORE_PASSWORD')
                keyAlias 'shc'
                keyPassword System.getenv('SHC_SIGNING_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // The app itself (application ID io.github.saefalasalynbtel198.shcport, label "SHC Port"). Signed with the
            // standard automatic Android debug key of the build machine (owner's decision for 0.3.6, docs/SIGNING.md).
            resValue 'string', 'app_label', 'SHC Port'
            if (System.getenv('SHC_SIGNING_KEYSTORE_FILE')) {
                signingConfig signingConfigs.shc     // optional, not used by CI for 0.3.6
            }
        }
        release {
            minifyEnabled false
            resValue 'string', 'app_label', 'SHC Port'
            if (System.getenv('SHC_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // The launcher intentionally uses only platform APIs (no AndroidX), see ARCHITECTURE.md.
        // ExpiredTargetSdkVersion: deliberate targetSdk 28, see defaultConfig comment.
        disable.addAll(['GradleDependency', 'OldTargetApi', 'AndroidGradlePluginVersion', 'ExpiredTargetSdkVersion'])
    }

    testOptions {
        unitTests.all {
            testLogging {
                events 'passed', 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('printVersion') {
    doLast {
        println "${appVersionName}|${appVersionCode}"
    }
}
