plugins {
    id 'com.android.application'
}

// Version is defined once here; CI and release workflows read it via `gradle -q printVersion`.
def appVersionName = '0.3.6-dev.2'
def appVersionCode = 12

android {
    // Windows test programs built by CI with mingw-w64 (app/winsrc, see .github/workflows/android-build.yml);
    // a local build without them still works, the display test then reports the program as missing.
    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/shc-assets"]
        }
    }
    namespace 'io.github.saefalasalynbtel198.shcport'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.saefalasalynbtel198.shcport'
        // Android 8.0: lowest version Box64/Wine-on-Android stacks are known to run on.
        minSdk 26
        // targetSdk 28 is required to run the Wine/Box64 runtime installed in app storage: for apps
        // targeting API 29+ Android blocks execve() AND PROT_EXEC mappings (dlopen) of files in the app
        // home directory (SELinux neverallow app_data_file:file execute). Termux and other Linux-userland
        // apps use 28 for the same reason. Consequence: sideload distribution only (not Google Play).
        // See docs/ARCHITECTURE.md "Executing the runtime on Android".
        targetSdk 28
        versionCode appVersionCode
        versionName appVersionName
        // No native code in BUILD 1. When the runtime lands, it is arm64-v8a only (see ARCHITECTURE.md).
    }

    signingConfigs {
        release {
            // Populated only in the release workflow from GitHub Actions secrets.
            def ks = System.getenv('SHC_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SHC_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SHC_KEY_ALIAS')
                keyPassword System.getenv('SHC_KEY_PASSWORD')
            }
        }
        // Permanent development key (since 0.3.6-dev.2): one keystore kept by the owner, given to CI only through
        // the GitHub Actions secrets SHC_DEV_* (scripts/ci/dev-signing.sh decodes it into the runner's temporary
        // directory and checks its certificate against signing/dev-certificate-sha256.txt). Never in the repository.
        dev {
            def ks = System.getenv('SHC_DEV_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SHC_DEV_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SHC_DEV_KEY_ALIAS')
                keyPassword System.getenv('SHC_DEV_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Side-by-side development app: its own package, app storage and runtime/prefix/game copy, so it
            // installs next to the 0.3.5-dev.1 app (io.github.saefalasalynbtel198.shcport) without touching it.
            applicationIdSuffix '.dev'
            versionNameSuffix '-debug'
            resValue 'string', 'app_label', 'SHC Port DEV'
            if (System.getenv('SHC_DEV_KEYSTORE_FILE')) {
                signingConfig signingConfigs.dev
            } else if (project.findProperty('shcRequireDevKey') == 'true') {
                // CI passes -PshcRequireDevKey=true: never fall back to the auto-generated debug key.
                throw new GradleException('Development signing key required (-PshcRequireDevKey=true) but SHC_DEV_KEYSTORE_FILE is not set. See docs/DEV_SIGNING.md.')
            }
        }
        release {
            minifyEnabled false
            resValue 'string', 'app_label', 'SHC Port'
            if (System.getenv('SHC_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // The launcher intentionally uses only platform APIs (no AndroidX), see ARCHITECTURE.md.
        // ExpiredTargetSdkVersion: deliberate targetSdk 28, see defaultConfig comment.
        disable.addAll(['GradleDependency', 'OldTargetApi', 'AndroidGradlePluginVersion', 'ExpiredTargetSdkVersion'])
    }

    testOptions {
        unitTests.all {
            testLogging {
                events 'passed', 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('printVersion') {
    doLast {
        println "${appVersionName}|${appVersionCode}"
    }
}
