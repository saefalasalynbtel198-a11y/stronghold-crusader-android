name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  BUILD_TOOLS: "35.0.0"
  PLATFORM: "android-35"
  # BUILD 1 ships no native code. Set to "arm64-v8a" once the runtime is packaged.
  EXPECTED_ABIS: ""

jobs:
  build:
    name: Test, lint, build and verify APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Repository hygiene (no proprietary game files)
        run: bash scripts/ci/check-no-proprietary-files.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;${PLATFORM}" "build-tools;${BUILD_TOOLS}" "platform-tools"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Read app version
        id: version
        run: |
          line=$(gradle -q :app:printVersion | tail -n1)
          echo "name=${line%%|*}" >> "$GITHUB_OUTPUT"
          echo "code=${line##*|}" >> "$GITHUB_OUTPUT"
          echo "Version: $line"

      - name: Unit tests
        run: |
          mkdir -p build-logs
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee build-logs/unit-tests.log

      - name: Lint
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:lintDebug 2>&1 | tee build-logs/lint.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build-logs/assemble.log

      - name: Verify APK
        run: bash scripts/ci/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk "${{ steps.version.outputs.name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stronghold-Crusader-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-logs/
            apk-signature.txt
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  smoke-test:
    name: Emulator smoke test (x86_64, API 30)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Stronghold-Crusader-Android-APK
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci/smoke-test.sh apk/app-debug.apk smoke-test-output

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: smoke-test-output/
          if-no-files-found: warn
          retention-days: 14
