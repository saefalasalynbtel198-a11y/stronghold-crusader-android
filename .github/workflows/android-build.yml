name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  BUILD_TOOLS: "35.0.0"
  PLATFORM: "android-35"
  # BUILD 1 ships no native code. Set to "arm64-v8a" once the runtime is packaged.
  EXPECTED_ABIS: ""

jobs:
  build:
    # Two independent builds on separate runners, both signed with the key derived from SHC_SIGNING_SEED:
    #   main   - the APK to install (unit tests, lint, checks)
    #   update - same code, version code + 1: only for the emulator update test and the certificate comparison
    name: Build ${{ matrix.variant }} APK${{ matrix.variant == 'main' && ' (test, lint, verify)' || ' (update test)' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [main, update]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Repository hygiene (no proprietary game files, no key files)
        run: bash scripts/ci/check-no-proprietary-files.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK components (preinstalled Android SDK on the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || { echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;${PLATFORM}" "build-tools;${BUILD_TOOLS}" "platform-tools" > sdk-install.log
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" || { cat sdk-install.log; echo "::error::build-tools ${BUILD_TOOLS} missing"; exit 1; }
          echo "Android SDK: $ANDROID_HOME"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Read app version
        id: version
        run: |
          line=$(gradle -q :app:printVersion | tail -n1)
          echo "name=${line%%|*}" >> "$GITHUB_OUTPUT"
          echo "code=${line##*|}" >> "$GITHUB_OUTPUT"
          echo "Version: $line"

      - name: Build Windows display test program (mingw-w64, shipped as an APK asset)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686
          mkdir -p app/build/generated/shc-assets
          i686-w64-mingw32-gcc -O2 -Wall -Werror -static -o app/build/generated/shc-assets/shc-display-test.exe \
            app/winsrc/shc-display-test.c -lgdi32
          sha256sum app/build/generated/shc-assets/shc-display-test.exe

      - name: Unit tests
        if: matrix.variant == 'main'
        run: |
          mkdir -p build-logs
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee build-logs/unit-tests.log

      - name: Lint
        if: matrix.variant == 'main'
        run: |
          mkdir -p build-logs
          set -o pipefail
          gradle --no-daemon --stacktrace :app:lintDebug 2>&1 | tee build-logs/lint.log

      # The SHC signing key (docs/SIGNING.md): derived from the GitHub Actions secret SHC_SIGNING_SEED, checked
      # against the committed certificate, written to a temporary keystore. No secret: this fails, no other key.
      - name: Signing key (derived from the SHC_SIGNING_SEED secret)
        env:
          SHC_SIGNING_SEED: ${{ secrets.SHC_SIGNING_SEED }}
        run: bash scripts/ci/signing.sh setup

      - name: Assemble APK (io.github.saefalasalynbtel198.shcport, signed with the SHC key)
        run: |
          mkdir -p build-logs
          set -o pipefail
          bump=$([ "${{ matrix.variant }}" = update ] && echo 1 || echo 0)
          gradle --no-daemon --stacktrace :app:assembleDebug -PshcRequireSigningKey=true -PshcVersionCodeBump=$bump 2>&1 | tee build-logs/assemble.log

      - name: Remove the temporary keystore
        if: always()
        run: bash scripts/ci/signing.sh cleanup

      - name: Verify APK (package, version, contents)
        run: bash scripts/ci/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk "${{ steps.version.outputs.name }}"

      - name: Verify the APK is signed with the pinned SHC certificate
        run: bash scripts/ci/signing.sh verify app/build/outputs/apk/debug/app-debug.apk

      - name: Check the display test program is in the APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-list.txt | grep "assets/shc-display-test.exe"
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/shc-display-test.exe | sha256sum

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'main' && 'Stronghold-Crusader-Android-APK' || 'update-test-APK-not-for-installation' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.variant }}
          path: |
            build-logs/
            apk-signature.txt
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  same-certificate:
    name: Both independent builds have the same signing certificate
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Download the main APK
        uses: actions/download-artifact@v4
        with:
          name: Stronghold-Crusader-Android-APK
          path: main
      - name: Download the update-test APK
        uses: actions/download-artifact@v4
        with:
          name: update-test-APK-not-for-installation
          path: update
      - name: Compare certificates, package and versions
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          for v in main update; do
            c=$("$bt/apksigner" verify --print-certs "$v/app-debug.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            echo "$v: $("$bt/aapt2" dump badging "$v/app-debug.apk" | head -1 | cut -d' ' -f2-4) certificate $c"
            echo "$c" > "$v.cert"
            bash scripts/ci/signing.sh verify "$v/app-debug.apk"
          done
          cmp main.cert update.cert && echo "Same certificate in both independent builds: $(cat main.cert)"
          {
            echo "### Signing"
            echo "Both independent builds are signed with certificate \`$(cat main.cert)\` (pinned)."
            echo "Main APK SHA-256: \`$(sha256sum main/app-debug.apk | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: Emulator (x86_64, API 30) smoke test and update test
    needs: [build, same-certificate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read      # download the 0.3.5-dev.1 APK artifact of an earlier run
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the main APK
        uses: actions/download-artifact@v4
        with:
          name: Stronghold-Crusader-Android-APK
          path: apk

      - name: Download the update-test APK
        uses: actions/download-artifact@v4
        with:
          name: update-test-APK-not-for-installation
          path: update-apk

      # The owner's installed 0.3.5-dev.1 APK (CI debug key fcd0e71c...), to confirm on the emulator that it cannot be
      # updated in place (so the one-time uninstall on the phone is expected) before the new app is installed.
      - name: Download the 0.3.5-dev.1 APK (run 44928832593)
        uses: actions/download-artifact@v4
        with:
          name: Stronghold-Crusader-Android-APK
          path: old-apk
          run-id: 44928832593
          github-token: ${{ github.token }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci/smoke-test.sh apk/app-debug.apk smoke-test-output old-apk/app-debug.apk update-apk/app-debug.apk

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: smoke-test-output/
          if-no-files-found: warn
          retention-days: 14

  display-qemu:
    name: Display path under qemu-aarch64 (runtime r6 + the app's display code; Linux not Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      R6_RUN_ID: "44911670217"   # Runtime components run that built runtime r6 (device-verified 2026-11-21)
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Download runtime r6 (unchanged, from its CI run)
        uses: actions/download-artifact@v4
        with:
          name: shc-runtime-package
          path: r6
          run-id: ${{ env.R6_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check runtime r6 checksum
        run: (cd r6 && cat shc-runtime-r6-*.zip.sha256 && sha256sum -c shc-runtime-r6-*.zip.sha256)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install tools (qemu-user, mingw; mksh = Android's /system/bin/sh and native Xvfb for the fd-3 reproduction)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support gcc-mingw-w64-i686 mksh xvfb
      - name: Build shc-display-test.exe (as for the APK)
        run: |
          mkdir -p out
          i686-w64-mingw32-gcc -O2 -Wall -Werror -static -o out/shc-display-test.exe app/winsrc/shc-display-test.c -lgdi32
          sha256sum out/shc-display-test.exe
      - name: Xvfb with the app's command line, test program through Box64 + Wine, framebuffer read by the app's code
        run: bash scripts/ci/test-app-display-qemu.sh r6/shc-runtime-r6-*.zip out/shc-display-test.exe "$RUNNER_TEMP/appdisplay"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-display-qemu-results
          path: |
            ${{ runner.temp }}/appdisplay/*.png
            ${{ runner.temp }}/appdisplay/*.log
            ${{ runner.temp }}/appdisplay/*.txt
          if-no-files-found: warn
