name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  BUILD_TOOLS: "35.0.0"
  PLATFORM: "android-35"
  # BUILD 1 ships no native code. Set to "arm64-v8a" once the runtime is packaged.
  EXPECTED_ABIS: ""

jobs:
  build:
    # Signed with the standard automatic Android debug key of the build machine (owner's decision for 0.3.6).
    name: Test, lint, build and verify APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Repository hygiene (no proprietary game files, no key files)
        run: bash scripts/ci/check-no-proprietary-files.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK components (preinstalled Android SDK on the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || { echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;${PLATFORM}" "build-tools;${BUILD_TOOLS}" "platform-tools" > sdk-install.log
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" || { cat sdk-install.log; echo "::error::build-tools ${BUILD_TOOLS} missing"; exit 1; }
          echo "Android SDK: $ANDROID_HOME"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Read app version
        id: version
        run: |
          line=$(gradle -q :app:printVersion | tail -n1)
          echo "name=${line%%|*}" >> "$GITHUB_OUTPUT"
          echo "code=${line##*|}" >> "$GITHUB_OUTPUT"
          echo "Version: $line"

      - name: Build Windows display test program (mingw-w64, shipped as an APK asset)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686
          mkdir -p app/build/generated/shc-assets
          i686-w64-mingw32-gcc -O2 -Wall -Werror -static -o app/build/generated/shc-assets/shc-display-test.exe \
            app/winsrc/shc-display-test.c -lgdi32
          sha256sum app/build/generated/shc-assets/shc-display-test.exe

      - name: Build the game-sound ALSA plugin (arm64, Debian trixie alsa-lib/glibc as runtime r6; APK asset)
        run: bash scripts/ci/build-alsa-plugin.sh app/build/generated/shc-assets/audio/libasound_module_pcm_shc.so

      - name: Unit tests
        run: |
          mkdir -p build-logs
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee build-logs/unit-tests.log

      - name: Lint
        run: |
          mkdir -p build-logs
          set -o pipefail
          gradle --no-daemon --stacktrace :app:lintDebug 2>&1 | tee build-logs/lint.log

      - name: Assemble APK (io.github.saefalasalynbtel198.shcport, standard debug signing)
        run: |
          mkdir -p build-logs
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build-logs/assemble.log
          cp app/build/outputs/apk/debug/app-debug.apk "SHC-Port-${{ steps.version.outputs.name }}.apk"

      - name: Verify APK (package, version, contents, signature)
        run: bash scripts/ci/verify-apk.sh "SHC-Port-${{ steps.version.outputs.name }}.apk" "${{ steps.version.outputs.name }}"

      - name: Check the display test program is in the APK
        run: |
          unzip -l "SHC-Port-${{ steps.version.outputs.name }}.apk" | tee /tmp/apk-list.txt | grep "assets/shc-display-test.exe"
          unzip -p "SHC-Port-${{ steps.version.outputs.name }}.apk" assets/shc-display-test.exe | sha256sum
          grep "assets/audio/libasound_module_pcm_shc.so" /tmp/apk-list.txt
          unzip -p "SHC-Port-${{ steps.version.outputs.name }}.apk" assets/audio/libasound_module_pcm_shc.so | sha256sum

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stronghold-Crusader-Android-APK
          path: SHC-Port-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-logs/
            apk-signature.txt
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  smoke-test:
    name: Emulator smoke test (x86_64, API 30)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read      # download the 0.3.5-dev.1 APK artifact of an earlier run
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the main APK
        uses: actions/download-artifact@v4
        with:
          name: Stronghold-Crusader-Android-APK
          path: apk

      # The owner's installed 0.3.5-dev.1 APK (CI debug key fcd0e71c...), to confirm on the emulator that it cannot be
      # updated in place (so the one-time uninstall on the phone is expected) before the new app is installed.
      - name: Download the 0.3.5-dev.1 APK (run 44928832593)
        uses: actions/download-artifact@v4
        with:
          name: Stronghold-Crusader-Android-APK
          path: old-apk
          run-id: 44928832593
          github-token: ${{ github.token }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci/smoke-test.sh apk/SHC-Port-*.apk smoke-test-output old-apk/app-debug.apk

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: smoke-test-output/
          if-no-files-found: warn
          retention-days: 14

  display-qemu:
    name: Display path under qemu-aarch64 (runtime r6 + the app's display code; Linux not Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      R6_RUN_ID: "44911670217"   # Runtime components run that built runtime r6 (device-verified 2026-11-21)
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Download runtime r6 (unchanged, from its CI run)
        uses: actions/download-artifact@v4
        with:
          name: shc-runtime-package
          path: r6
          run-id: ${{ env.R6_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check runtime r6 checksum
        run: (cd r6 && cat shc-runtime-r6-*.zip.sha256 && sha256sum -c shc-runtime-r6-*.zip.sha256)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install tools (qemu-user, mingw; mksh = Android's /system/bin/sh and native Xvfb for the fd-3 reproduction)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support gcc-mingw-w64-i686 mksh xvfb
      - name: Build shc-display-test.exe (as for the APK), shc-audio-test.exe (CI only) and the ALSA plugin (as for the APK)
        run: |
          mkdir -p out
          i686-w64-mingw32-gcc -O2 -Wall -Werror -static -o out/shc-display-test.exe app/winsrc/shc-display-test.c -lgdi32
          i686-w64-mingw32-gcc -O2 -Wall -Werror -static -o out/shc-audio-test.exe app/winsrc/shc-audio-test.c -ldsound -ldxguid -lm
          bash scripts/ci/build-alsa-plugin.sh out/libasound_module_pcm_shc.so
          sha256sum out/*.exe
      - name: Game-sound plugin with the app's receiver (runner build of the same source; on-time, late writer, two streams, no app)
        run: |
          sudo apt-get install -y --no-install-recommends libasound2-dev
          bash scripts/ci/test-audio-plugin-native.sh "$RUNNER_TEMP/audio-native"
      - name: Xvfb with the app's command line, test program through Box64 + Wine, framebuffer read by the app's code
        run: bash scripts/ci/test-app-display-qemu.sh r6/shc-runtime-r6-*.zip out/shc-display-test.exe "$RUNNER_TEMP/appdisplay" out/libasound_module_pcm_shc.so out/shc-audio-test.exe
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-display-qemu-results
          path: |
            ${{ runner.temp }}/appdisplay/*.png
            ${{ runner.temp }}/appdisplay/*.log
            ${{ runner.temp }}/appdisplay/*.txt
          if-no-files-found: warn
