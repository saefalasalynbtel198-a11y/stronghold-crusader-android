name: Display feasibility (BUILD 3 phase 3, step 3.0)

# CI-only feasibility test of the display path: Xvfb (Debian arm64) + Wine's X11 driver through Box64, using the
# unchanged runtime r5 package. Changes neither the app nor the runtime package. Linux emulation, not Android.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/spike/display/**'
      - '.github/workflows/display-feasibility.yml'

permissions:
  contents: read
  actions: read

jobs:
  display:
    name: Xvfb + Wine window + cnc-ddraw under qemu-aarch64 (pixels, seccomp, paths)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      R5_RUN_ID: "44823423675"   # Runtime components run that built runtime r5 (device-verified 2026-11-21)
    steps:
      - uses: actions/checkout@v4
      - name: Download runtime r5 (unchanged, from its CI run)
        uses: actions/download-artifact@v4
        with:
          name: shc-runtime-package
          path: r5
          run-id: ${{ env.R5_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check runtime r5 checksum
        run: |
          ls -la r5
          (cd r5 && sha256sum -c shc-runtime-r5-*.zip.sha256)
      - name: Set up JDK 17 (for the app's extractor)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install tools (qemu-user, mmdebstrap, mingw)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support mmdebstrap \
            debian-archive-keyring gcc-mingw-w64-i686 gcc-aarch64-linux-gnu
      - name: Build shc-gui-smoke.exe (i686, like the game)
        run: |
          mkdir -p out
          i686-w64-mingw32-gcc -O2 -Wall -Werror -static -o out/shc-gui-smoke.exe \
            runtime/spike/display/shc-gui-smoke.c -lgdi32
          sha256sum out/shc-gui-smoke.exe
      - name: Build libshc-sameid.so (aarch64 preload for Xvfb; see its header)
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Werror -o out/libshc-sameid.so runtime/spike/display/shc-sameid.c
          sha256sum out/libshc-sameid.so
      - name: Feasibility test
        run: bash runtime/spike/display/run-feasibility.sh r5/shc-runtime-r5-*.zip out/shc-gui-smoke.exe out/libshc-sameid.so "$RUNNER_TEMP/df"
      - name: Upload results (screenshots, logs, checks)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: display-feasibility-results
          path: |
            ${{ runner.temp }}/df/*.png
            ${{ runner.temp }}/df/*.log
            ${{ runner.temp }}/df/*.txt
          if-no-files-found: warn
