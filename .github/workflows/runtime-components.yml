name: Runtime components (experimental)

# Builds and fetches the third-party pieces of the planned Wine + Box64 runtime.
# The final job assembles shc-runtime-*.zip, which the app installs via "Runtime → Install runtime package"
# (BUILD 2). It is not embedded in the APK (size; see docs/ARCHITECTURE.md).
# Kept separate from android-build.yml so its experimental status is visible on its own
# and never hides or weakens the APK build result.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - ".github/workflows/runtime-components.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "app/src/main/java/io/github/saefalasalynbtel198/shcport/core/RuntimeArchive.java"
      - "scripts/ci/ExtractRuntime.java"
      - ".github/workflows/runtime-components.yml"

permissions:
  contents: read

jobs:
  box64:
    name: Box64 (aarch64 glibc, dynarec)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross cmake ninja-build file python3
      - name: Build Box64
        run: bash runtime/scripts/build-box64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-box64-aarch64
          path: |
            runtime/out/bin/box64
            runtime/out/box64.file.txt
            runtime/out/licenses/
            runtime/out/x64lib/
          if-no-files-found: error

  inputs:
    name: Wine WoW64 + cnc-ddraw (pinned downloads)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify
        run: bash runtime/scripts/fetch-components.sh
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-inputs
          path: runtime/out/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Assemble runtime package
    needs: [box64, inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download Box64
        uses: actions/download-artifact@v4
        with:
          name: runtime-box64-aarch64
          path: runtime/out
      - name: Download Wine and cnc-ddraw
        uses: actions/download-artifact@v4
        with:
          name: runtime-inputs
          path: runtime/out
      - name: Restore executable bit (artifacts do not keep permissions)
        run: chmod 0755 runtime/out/bin/box64
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring file unzip xz-utils python3
      - name: Build ARM64 glibc userland
        run: sudo bash runtime/scripts/build-userland.sh && sudo chown -R "$(id -u):$(id -g)" runtime/out
      - name: Assemble package
        run: bash runtime/scripts/assemble-runtime.sh
      - name: Summary
        run: |
          {
            echo "### Runtime package"
            echo
            echo '```'
            ls -l runtime/out/shc-runtime-*.zip
            cat runtime/out/shc-runtime-*.zip.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: shc-runtime-package
          path: |
            runtime/out/shc-runtime-*.zip
            runtime/out/shc-runtime-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Set up JDK 17 (for the app's extractor)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install qemu-user-static
        run: sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: Self-test the package under qemu-aarch64 (Linux ARM64, not Android)
        run: bash runtime/scripts/test-runtime-qemu.sh runtime/out/shc-runtime-*.zip "$RUNNER_TEMP/rt-test"
      - name: Upload qemu self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-qemu-selftest
          path: ${{ runner.temp }}/rt-test/qemu-selftest.txt
          if-no-files-found: warn
